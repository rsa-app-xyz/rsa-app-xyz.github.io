<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>RSA-App</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="kontainerJudul">
      <h1>Bangsal</h1>
    </div>

    <div id="kontainerCopyPlan">
      <h1>Copy Plan</h1>
    </div>

    <div id="kontainerDischarge">
      <h1><a href="https://gemini.google.com/share/8606ad87457d" target="_blank" style="text-decoration: none; color: black;">Discharge Summary</a></h1>
    </div>

    <div id="kontainerForm">
      <form class="pengaturanForm" action="index.html" method="post">
        <div class="">
          <input type="text" name="pssom" value="" id="pssom" placeholder="P/S/SO/M">
        </div>
        <div class="">
          <input type="text" name="nama" value="" id="nama" placeholder="Nama">
        </div>
        <div class="">
          <input type="text" name="kelamin" value="" id="kelamin" placeholder="Kelamin">
        </div>
        <div class="">
          <input type="text" name="umur" value="" id="umur" placeholder="Umur">
        </div>
        <div class="">
          <textarea name="keluhan" rows="5" cols="25" id="keluhan" placeholder="Keluhan"></textarea>
        </div>
        <div class="">
          <textarea name="ttv" rows="2" cols="25" id="ttv" placeholder="TTV"></textarea>
        </div>
        <div class="">
          <textarea name="pemfis" rows="2" cols="25" id="pemfis" placeholder="Pemfis"></textarea>
        </div>
        <div class="">
          <textarea name="diagnosis" rows="3" cols="25" id="diagnosis" placeholder="Diagnosis"></textarea>
        </div>
        <div class="">
          <textarea name="plan" rows="5" cols="25" id="plan" placeholder="Plan"></textarea>
        </div>
        <div class="">
          <input type="text" name="alasanKonsul" value="" id="alasanKonsul" placeholder="Alasan Konsul">
        </div>
        <button type="button" name="tombolKetikanIgd" id="tombolKetikanBangsal">Buat Ketikan Bangsal</button>
        <button type="button" name="tombolReset" id="tombolReset">Reset</button>
      </form>
    </div>

    <div class="none" id="kontainerKetikan">

    </div>

    <div id="kontainerTextarea" class="none">
      <textarea name="name" rows="30" cols="80" style="background-color: #F5F5DC"></textarea>
    </div>

    <button type="button" name="tombolHome" id="tombolHome"><h1><a href="../index.html" style="text-decoration: none; color: black;">Home</a></h1></button>

  </body>

  <script type="text/javascript" src="../script/fungsiGlobal.js">

  </script>

  <script type="text/javascript" src="script.js">

  </script>

</html>
