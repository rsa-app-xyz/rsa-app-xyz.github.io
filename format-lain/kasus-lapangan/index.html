<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>RSA-App</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="kontainerJudul">
      <h1>Format KL</h1>
    </div>

    <div id="kontainerForm">
      <form class="pengaturanForm" action="index.html" method="post">
        <div class="">
          <textarea name="kasus" rows="5" cols="25" id="kasus" placeholder="Kasus"></textarea>
        </div>
        <div class="">
          <textarea name="rekomendasiJika" rows="2" cols="25" id="rekomendasiJika" placeholder="Jika"></textarea>
        </div>
        <div class="">
          <textarea name="rekomendasiMaka" rows="2" cols="25" id="rekomendasiMaka" placeholder="Maka"></textarea>
        </div>
        <div class="">
          <textarea name="catatan" rows="5" cols="25" id="catatan" placeholder="Catatan"></textarea>
        </div>
        <button type="button" name="tombolKetikanKasusLapangan" id="tombolKetikanKasusLapangan">Buat Ketikan KL</button>
        <button type="button" name="tombolReset" id="tombolReset">Reset</button>
      </form>
    </div>

    <div class="none" id="kontainerKetikan">

    </div>

    <div id="kontainerTextarea" class="none">
      <textarea name="name" rows="20" cols="80" style="background-color: #F5F5DC"></textarea>
    </div>

    <button type="button" name="tombolBack" id="tombolBack"><h1><a href="../../other/index.html" style="text-decoration: none; color: black;">Back</a></h1></button>

  </body>

  <script type="text/javascript" src="../../script/fungsiGlobal.js">

  </script>

  <script type="text/javascript" src="script.js">

  </script>

</html>
